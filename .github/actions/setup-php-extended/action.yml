name: Setup PHP with LiteCart Extensions
description: Configure latest stable PHP with extensions needed for LiteCart testing

runs:
  using: composite
  steps:
    - name: Setup PHP (latest)
      uses: shivammathur/setup-php@v2
      with:
        php-version: 'latest'
        extensions: apcu, curl, gd, intl, mbstring, mysqli, simplexml, xml, zip
        ini-values: date.timezone=America/New_York, apc.enable_cli=1
        tools: none
        coverage: none