name: CI

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

defaults:
  run:
    working-directory: .

jobs:
  lint-and-build:
    name: PHP Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: PHP lint
        run: npm run phplint

      - name: Build
        run: npm run build
