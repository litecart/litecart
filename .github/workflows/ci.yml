name: CI

on:
  pull_request:
    branches: [dev-major]
  push:
    branches: [dev-major]
  workflow_dispatch:

env:
  INSTALLER_CMD: |
    php public_html/install/install.php \
      --db_server=127.0.0.1 \
      --db_username=litecart \
      --db_password=litecart \
      --db_database=litecart \
      --db_table_prefix=lc_ \
      --document_root=public_html \
      --store_name='LiteCart' \
      --store_email='ci@litecart.net' \
      --store_country_code=US \
      --store_language_code=en \
      --store_time_zone='America/New_York' \
      --backend_alias=admin \
      --username=litecart \
      --password=litecart \
      --development_type=standard \
      --cleanup=0

jobs:

  check:
    name: PHP & Asset Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (latest)
        uses: ./.github/actions/setup-php-extended

      - name: PHP Lint
        run: |
          bash scripts/scan-php-syntax.sh

      - name: JSON Lint
        run: |
          bash scripts/scan-json-syntax.sh

      - name: SQL Lint
        run: |
          bash scripts/scan-sql-syntax.sh

      - name: SCSS Lint
        run: |
          bash scripts/scan-scss-syntax.sh

      - name: Debug Statement Scanner
        continue-on-error: true
        run: |
          bash scripts/scan-debug-statements.sh

      - name: Insecure PRNG Scanner
        run: |
          bash scripts/scan-insecure-prng.sh

  build:
    name: Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install build dependencies
        run: bun install --no-audit --no-fund

      - name: Build assets
        run: |
          bun run build:once

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: built-assets
          path: public_html/assets
          retention-days: 1

  install:
    name: Install Application
    runs-on: ubuntu-latest
    needs: [check, build]
    strategy:
      fail-fast: false
      matrix:
        db:
          - image: mariadb:latest
            slug: mariadb-latest
            health: 'mariadb-admin ping -h localhost -u root -plitecart'
          - image: mysql:latest
            slug: mysql-latest
            health: 'mysqladmin ping -h localhost -u root -plitecart'

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          # Both env-var families are set so the service block works on
          # mariadb:latest (which no longer accepts the legacy MYSQL_*
          # aliases) and on mysql:latest (which ignores MARIADB_*).
          MYSQL_ROOT_PASSWORD: litecart
          MYSQL_DATABASE: litecart
          MYSQL_USER: litecart
          MYSQL_PASSWORD: litecart
          MARIADB_ROOT_PASSWORD: litecart
          MARIADB_DATABASE: litecart
          MARIADB_USER: litecart
          MARIADB_PASSWORD: litecart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (latest)
        uses: ./.github/actions/setup-php-extended

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public_html/assets

      - name: Run installer via CLI
        run: ${{ env.INSTALLER_CMD }}

  platform-tests:
    name: Platform Tests
    runs-on: ubuntu-latest
    needs: [check, build, install]

    services:
      mariadb:
        image: mariadb:latest
        env:
          # mariadb:latest no longer accepts legacy MYSQL_* aliases — set
          # both families so this block survives future image renames too.
          MYSQL_ROOT_PASSWORD: litecart
          MYSQL_DATABASE: litecart
          MYSQL_USER: litecart
          MYSQL_PASSWORD: litecart
          MARIADB_ROOT_PASSWORD: litecart
          MARIADB_DATABASE: litecart
          MARIADB_USER: litecart
          MARIADB_PASSWORD: litecart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -u root -plitecart"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (latest)
        uses: ./.github/actions/setup-php-extended

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public_html/assets

      - name: Run installer via CLI
        run: ${{ env.INSTALLER_CMD }}

      - name: Verify installation
        run: |
          test -f public_html/storage/config.inc.php && echo "config.inc.php exists"
          mysql -h 127.0.0.1 -u litecart -plitecart litecart \
            -e "SELECT COUNT(*) as tables FROM information_schema.tables WHERE table_schema='litecart' AND table_name LIKE 'lc_%';"

      - name: Run platform tests
        continue-on-error: true
        run: php .git-hooks/pre-commit.d/platform_tests.php

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [check, build, install]

    strategy:
      fail-fast: false
      matrix:
        db:
          - image: mariadb:latest
            slug: mariadb-latest
            health: 'mariadb-admin ping -h localhost -u root -plitecart'
          - image: mysql:latest
            slug: mysql-latest
            health: 'mysqladmin ping -h localhost -u root -plitecart'

    services:
      mariadb:
        image: ${{ matrix.db.image }}
        env:
          # Set both env-var families so the block works on either engine
          # (mariadb:latest no longer accepts legacy MYSQL_* aliases).
          MYSQL_ROOT_PASSWORD: litecart
          MYSQL_DATABASE: litecart
          MYSQL_USER: litecart
          MYSQL_PASSWORD: litecart
          MARIADB_ROOT_PASSWORD: litecart
          MARIADB_DATABASE: litecart
          MARIADB_USER: litecart
          MARIADB_PASSWORD: litecart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (latest)
        uses: ./.github/actions/setup-php-extended

      - name: Setup Bun (latest)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --no-audit --no-fund

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public_html/assets

      - name: Run installer via CLI
        run: ${{ env.INSTALLER_CMD }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: bunx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.db.slug }}
          path: playwright-report/
          retention-days: 14